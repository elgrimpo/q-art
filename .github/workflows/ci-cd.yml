name: CI / CD

on:
  push:
    branches: [master, beta]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: npm
      - run: npm ci
      - run: npm run lint

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: npm
      - run: npm ci
      - run: npm run test:frontend

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest api/tests/ -v -m "not e2e"
      - name: Run DB-backed e2e tests
        run: python -m pytest api/tests/e2e/ -v -m "e2e and not novita" --timeout=30
        env:
          MONGO_URL: mongodb://localhost:27017
          BACKEND_JWT_SECRET: ${{ secrets.BACKEND_JWT_SECRET }}
          STRIPE_ENDPOINT_SECRET: ${{ secrets.STRIPE_ENDPOINT_SECRET }}

  # Deployment is handled by Heroku's own GitHub integration (Automatic deploys
  # from master), so there is no deploy job here. A previous akhileshns/heroku-deploy
  # job depended on a Heroku CLI that GitHub's ubuntu-latest runners no longer ship,
  # so it failed on every push — and with "Wait for CI to pass" enabled that failing
  # check blocked Heroku's auto-deploys. Keeping CI to lint + tests only lets the
  # check go green so Heroku deploys.
