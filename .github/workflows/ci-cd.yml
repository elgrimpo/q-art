name: CI / CD

on:
  push:
    branches: [master, beta]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: npm
      - run: npm ci
      - run: npm run lint

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: npm
      - run: npm ci
      - run: npm run test:frontend

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest api/tests/ -v --ignore=api/tests/e2e
      - name: Run DB-backed e2e tests
        run: python -m pytest api/tests/e2e/ -v -m "e2e and not novita" --timeout=30
        env:
          MONGO_URL: mongodb://localhost:27017
          BACKEND_JWT_SECRET: ${{ secrets.BACKEND_JWT_SECRET }}
          STRIPE_ENDPOINT_SECRET: ${{ secrets.STRIPE_ENDPOINT_SECRET }}

  deploy:
    name: Deploy to Heroku
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [lint, test-frontend, test-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
